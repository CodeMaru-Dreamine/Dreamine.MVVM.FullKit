# =========================================================================
# wedding.codemaru.co.kr
#
# nginx.conf의 기존 wedding.codemaru.co.kr server 블록 전체를 이 내용으로
# 교체한 뒤 `nginx -t`와 `nginx -s reload`를 순서대로 실행합니다.
#
# 전제:
#   upstream wedding_app { server 192.168.0.100:4080; }
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
# =========================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name wedding.codemaru.co.kr;

    ssl_certificate         D:/win-acme/wedding/wedding.codemaru.co.kr-chain.pem;
    ssl_certificate_key     D:/win-acme/wedding/wedding.codemaru.co.kr-key.pem;
    ssl_trusted_certificate D:/win-acme/wedding/wedding.codemaru.co.kr-chain-only.pem;

    ssl_protocols             TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers on;
    ssl_ciphers               'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-CHACHA20-POLY1305';
    ssl_ecdh_curve            X25519:secp384r1;

    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver         1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Content-Security-Policy   "default-src 'self' https: data: blob:; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; frame-src 'self' https://www.google.com https://maps.googleapis.com; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; frame-ancestors 'self' https://codemaru.co.kr https://www.codemaru.co.kr;" always;

    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;

    location = /sitemap.xml {
        root C:/Wedding/wwwroot;
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /robots.txt {
        root C:/Wedding/wwwroot;
        try_files /robots.txt =404;
        add_header Content-Type  "text/plain; charset=utf-8" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Blazor Server의 WebSocket, SSE, Long Polling 전용 경로입니다.
    # 실시간 프레임이 지연되지 않도록 이 경로에서만 버퍼링을 끕니다.
    location ^~ /_blazor {
        proxy_pass http://wedding_app;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_buffering       off;
    }

    # HTML과 그 밖의 일반 요청은 nginx 버퍼링을 사용해 앱 연결을 빨리
    # 반환하고, 느린 외부 클라이언트가 앱 작업 스레드를 오래 점유하지
    # 않도록 합니다.
    location / {
        proxy_pass http://wedding_app;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_buffering       on;
    }
}
