worker_processes auto;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    access_log  logs/access.log;
    error_log   logs/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout   65;
    keepalive_requests  1000;
    server_names_hash_bucket_size 128;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml
        application/wasm;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $http_authorization $auth_ok {
        default 0;
        "~*^Bearer\s+CODEMARU_AI_TOKEN_001$" 1;
    }

    upstream wedding_app   { server 192.168.0.100:4080; keepalive 128; }
    upstream thankyou_app  { server 192.168.0.100:4088; keepalive 128; }
    upstream families_app  { server 192.168.0.100:5080; keepalive 128; }
    upstream cctv_app      { server 192.168.0.100:6080; keepalive 128; }
    upstream portfolio_app { server 192.168.0.100:7080; keepalive 128; }
    upstream shop_app      { server 192.168.0.100:9080; keepalive 128; }
    upstream codemaru_app  { server 192.168.0.100:3080; keepalive 128; }
    upstream dreamine_app  { server 192.168.0.100:4090; keepalive 128; }

    # =========================================================================
    # LM Studio API (내부망 전용, Bearer 토큰 인증)
    # =========================================================================
    server {
        listen 1235;
        server_name _;

        allow 192.168.0.0/24;
        deny  all;

        if ($auth_ok = 0) { return 401; }

        location / {
            proxy_pass http://127.0.0.1:1234;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    }

    # =========================================================================
    # HTTP -> HTTPS 리디렉션 + ACME 챌린지
    # =========================================================================
    server {
        listen 80;
        server_name
            wedding.codemaru.co.kr
            thankyou.codemaru.co.kr
            families.codemaru.co.kr
            cctvviewer.codemaru.co.kr
            portfolio.codemaru.co.kr
            shop.codemaru.co.kr
            codemaru.co.kr
            www.codemaru.co.kr
            mail.codemaru.co.kr
            dreamine.kr
            www.dreamine.kr;

        location ^~ /.well-known/acme-challenge/ {
            alias D:/win-acme/wwwroot/.well-known/acme-challenge/;
            default_type text/plain;
            try_files $uri =404;
            add_header Cache-Control "no-cache";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # 443 catch-all (알 수 없는 host 차단)
    # =========================================================================
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate         D:/win-acme/codemaru/codemaru.co.kr-chain.pem;
        ssl_certificate_key     D:/win-acme/codemaru/codemaru.co.kr-key.pem;
        ssl_trusted_certificate D:/win-acme/codemaru/codemaru.co.kr-chain-only.pem;

        return 444;
    }

    # =========================================================================
    # www.codemaru.co.kr -> codemaru.co.kr
    # =========================================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name www.codemaru.co.kr;

        ssl_certificate         D:/win-acme/codemaru/codemaru.co.kr-chain.pem;
        ssl_certificate_key     D:/win-acme/codemaru/codemaru.co.kr-key.pem;
        ssl_trusted_certificate D:/win-acme/codemaru/codemaru.co.kr-chain-only.pem;

        return 301 https://codemaru.co.kr$request_uri;
    }

    # =========================================================================
    # www.dreamine.kr -> dreamine.kr
    # =========================================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name www.dreamine.kr;

        ssl_certificate         D:/win-acme/dreamine/dreamine.kr-chain.pem;
        ssl_certificate_key     D:/win-acme/dreamine/dreamine.kr-key.pem;
        ssl_trusted_certificate D:/win-acme/dreamine/dreamine.kr-chain-only.pem;

        return 301 https://dreamine.kr$request_uri;
    }

    # =========================================================================
    # dreamine.kr
    # =========================================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name dreamine.kr;

        ssl_certificate         D:/win-acme/dreamine/dreamine.kr-chain.pem;
        ssl_certificate_key     D:/win-acme/dreamine/dreamine.kr-key.pem;
        ssl_trusted_certificate D:/win-acme/dreamine/dreamine.kr-chain-only.pem;

        ssl_protocols             TLSv1.3 TLSv1.2;
        ssl_prefer_server_ciphers on;
        ssl_ciphers               'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-CHACHA20-POLY1305';
        ssl_ecdh_curve            X25519:secp384r1;

        ssl_stapling        on;
        ssl_stapling_verify on;
        resolver         1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        add_header X-Site-Block              "dreamine" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy   "default-src 'self' https: data: blob:; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; frame-src 'self' https://www.google.com https://maps.googleapis.com; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; frame-ancestors 'self';" always;

        location = /__whoami {
            default_type text/plain;
            return 200 "dreamine";
        }

        location = /robots.txt {
            root C:/Dreamine/wwwroot;
            try_files /robots.txt =404;
            add_header Content-Type  "text/plain; charset=utf-8" always;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        location ^~ /_blazor {
            proxy_pass http://dreamine_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
	    proxy_set_header X-Forwarded-Host  $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://dreamine_app;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering on;
        }
    }

