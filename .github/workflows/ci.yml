name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Windows build and tests
    runs-on: windows-2025
    permissions:
      contents: read
    env:
      SONAR_PROJECT_KEY: CodeMaru-Dreamine_Dreamine.MVVM.FullKit
      SONAR_ORGANIZATION: codemaru-dreamine
      SONAR_SCANNER_VERSION: 11.2.1
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: false
          fetch-depth: 0

      - name: Enable Git long paths
        run: git config --global core.longpaths true

      - name: Checkout submodules
        shell: pwsh
        run: |
          $modules = @()
          $current = @{}

          foreach ($line in Get-Content ".gitmodules") {
            if ($line -match '^\[submodule "(.+)"\]') {
              if ($current.Path -and $current.Url) {
                $modules += [pscustomobject]$current
              }
              $current = @{}
            }
            elseif ($line -match '^\s*path = (.+)$') {
              $current.Path = $Matches[1].Trim()
            }
            elseif ($line -match '^\s*url = (.+)$') {
              $current.Url = $Matches[1].Trim()
            }
          }

          if ($current.Path -and $current.Url) {
            $modules += [pscustomobject]$current
          }

          foreach ($module in $modules) {
            $treeLine = git ls-tree HEAD -- "$($module.Path)"
            if ($treeLine -notmatch '^160000\s+commit\s+([0-9a-f]+)\s+') {
              throw "Could not find gitlink SHA for $($module.Path)"
            }

            $sha = $Matches[1]
            Write-Host "Checking out $($module.Path) at $sha"
            New-Item -ItemType Directory -Force -Path (Split-Path $module.Path) | Out-Null
            git clone --no-checkout "$($module.Url)" "$($module.Path)"
            git -C "$($module.Path)" checkout "$sha"
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Install SonarScanner for .NET
        if: >-
          env.SONAR_TOKEN != '' &&
          (github.ref == 'refs/heads/main' ||
           (github.event_name == 'pull_request' &&
            github.actor != 'dependabot[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository))
        shell: pwsh
        run: |
          dotnet tool install dotnet-sonarscanner `
            --tool-path "$env:RUNNER_TEMP\sonar-scanner" `
            --version "$env:SONAR_SCANNER_VERSION"

      - name: Restore test projects
        run: |
          dotnet restore "20_SOURCES/200. Tests/Dreamine.FullKit.Tests/Dreamine.FullKit.Tests.csproj"
          dotnet restore "20_SOURCES/200. Tests/Dreamine.FullKit.Wpf.Tests/Dreamine.FullKit.Wpf.Tests.csproj"
          dotnet restore "20_SOURCES/200. Tests/UI.WinForms.Tests/Dreamine.UI.WinForms.Tests.csproj"
          dotnet restore "20_SOURCES/200. Tests/UI.Blazor.Tests/Dreamine.UI.Blazor.Tests.csproj"
          dotnet restore "20_SOURCES/200. Tests/Wedding.Layouts.Contracts.Tests/Wedding.Layouts.Contracts.Tests.csproj"
          dotnet restore "20_SOURCES/200. Tests/WeddingPlatform.LayoutWorkflow.Tests/WeddingPlatform.LayoutWorkflow.Tests.csproj"
          dotnet restore "20_SOURCES/200. Tests/Wedding.Layouts.PipelineSmoke/Wedding.Layouts.PipelineSmoke.csproj"
          dotnet restore "20_SOURCES/998. DEMO/000. Sample/010. Wpfs/SampleCore/SampleCore.csproj"
          dotnet restore "20_SOURCES/998. DEMO/000. Sample/050. CrossUi/SampleCrossUi.Wpf/SampleCrossUi.Wpf.csproj"
          dotnet restore "20_SOURCES/000. Project/010. App/Dreamine.Web/Dreamine.Web.csproj"
          dotnet restore "20_SOURCES/000. Project/010. App/DreamineVMS.Web/DreamineVMS.Web.csproj"
          dotnet restore "20_SOURCES/000. Project/010. App/DreamineVMS/DreamineVMS.csproj"
          dotnet restore "20_SOURCES/000. Project/010. App/Families.AutoWriter/Families.AutoWriter.csproj"
          dotnet restore "20_SOURCES/000. Project/010. App/Families.Web/Families.Web.csproj"
          dotnet restore "20_SOURCES/000. Project/010. App/Portfolio.Web/Portfolio.Web.csproj"
          dotnet restore "20_SOURCES/000. Project/010. App/ShopPlatform.Web/ShopPlatform.Web.csproj"
          dotnet restore "20_SOURCES/000. Project/010. App/WeddingPlatform.Web/WeddingPlatform.Web.csproj"
          dotnet restore "20_SOURCES/000. Project/010. App/WeddingThankYou/WeddingThankYou.csproj"
          dotnet restore "20_SOURCES/000. Project/010. App/Wedding.Layouts.Editor.Wpf/Wedding.Layouts.Editor.Wpf.csproj"

      - name: Begin SonarCloud analysis
        if: >-
          env.SONAR_TOKEN != '' &&
          (github.ref == 'refs/heads/main' ||
           (github.event_name == 'pull_request' &&
            github.actor != 'dependabot[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository))
        shell: pwsh
        run: |
          $scanner = Join-Path $env:RUNNER_TEMP "sonar-scanner\dotnet-sonarscanner.exe"
          $projectVersion = (git describe --tags --abbrev=0 2>$null)
          if ([string]::IsNullOrWhiteSpace($projectVersion)) {
            $projectVersion = "0.0.0"
          }
          else {
            $projectVersion = $projectVersion.Trim().TrimStart("v")
          }

          Write-Host "SonarCloud project version: $projectVersion"
          $exclusions = @(
            ".agents/**",
            ".claude/**",
            ".codex/**",
            ".codex-*/**",
            ".encoding-recovery/**",
            ".screen-update/**",
            ".tmp/**",
            ".ua/**",
            ".sonarqube/**",
            "artifacts/**",
            "video_work/**",
            "10_DOCUMENTS/**",
            "50_SETUP/**",
            "GenOg/**",
            "20_SOURCES/998. DEMO/**",
            "20_SOURCES/000. Project/010. App/WeddingPlatform.Web/load-tests/**",
            "hf_wan22_*.py",
            "pollinations_ltx_test.py",
            "**/bin/**",
            "**/obj/**",
            "**/publish/**",
            "**/TestResults/**",
            "**/wwwroot/lib/**",
            "**/*.min.js",
            "**/*.min.css"
          ) -join ","
          $cpdExclusions = @(
            "**/*.g.cs",
            "**/*.g.i.cs",
            "**/*.Designer.cs",
            "**/Migrations/**",
            "**/wwwroot/lib/**",
            "**/*.min.js",
            "**/*.min.css"
          ) -join ","
          $coverageExclusions = @(
            "20_SOURCES/000. Project/010. App/**/*.razor",
            "20_SOURCES/000. Project/010. App/**/wwwroot/js/**",
            "20_SOURCES/000. Project/010. App/**/Services/Json*Store.cs",
            "20_SOURCES/000. Project/010. App/**/Services/ShopCustomerProfileStore.cs",
            "20_SOURCES/000. Project/010. App/**/Data/TenantDbContextFactory.cs"
          ) -join ","

          & $scanner begin `
            "/k:$env:SONAR_PROJECT_KEY" `
            "/o:$env:SONAR_ORGANIZATION" `
            "/v:$projectVersion" `
            "/d:sonar.token=$env:SONAR_TOKEN" `
            "/d:sonar.scanner.scanAll=true" `
            "/d:sonar.sourceEncoding=UTF-8" `
            "/d:sonar.cs.opencover.reportsPaths=$env:RUNNER_TEMP\TestResults\**\coverage.opencover.xml" `
            "/d:sonar.cs.vstest.reportsPaths=$env:RUNNER_TEMP\TestResults\**\*.trx" `
            "/d:sonar.exclusions=$exclusions" `
            "/d:sonar.coverage.exclusions=$coverageExclusions" `
            "/d:sonar.cpd.exclusions=$cpdExclusions"

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run tests
        shell: pwsh
        run: |
          $settings = ".github/coverlet.runsettings"
          $results = Join-Path $env:RUNNER_TEMP "TestResults"

          dotnet test "20_SOURCES/200. Tests/Dreamine.FullKit.Tests/Dreamine.FullKit.Tests.csproj" --no-restore --configuration Release -m:1 --verbosity minimal --filter "Category!=GeneratedOntology" --collect:"XPlat Code Coverage" --settings $settings --results-directory "$results\fullkit" --logger "trx;LogFileName=fullkit.trx"
          dotnet test "20_SOURCES/200. Tests/Dreamine.FullKit.Wpf.Tests/Dreamine.FullKit.Wpf.Tests.csproj" --no-restore --configuration Release -m:1 --verbosity minimal --collect:"XPlat Code Coverage" --settings $settings --results-directory "$results\fullkit-wpf" --logger "trx;LogFileName=fullkit-wpf.trx"
          dotnet test "20_SOURCES/200. Tests/UI.WinForms.Tests/Dreamine.UI.WinForms.Tests.csproj" --no-restore --configuration Release -m:1 --verbosity minimal --collect:"XPlat Code Coverage" --settings $settings --results-directory "$results\ui-winforms" --logger "trx;LogFileName=ui-winforms.trx"
          dotnet test "20_SOURCES/200. Tests/UI.Blazor.Tests/Dreamine.UI.Blazor.Tests.csproj" --no-restore --configuration Release -m:1 --verbosity minimal --collect:"XPlat Code Coverage" --settings $settings --results-directory "$results\ui-blazor" --logger "trx;LogFileName=ui-blazor.trx"
          dotnet test "20_SOURCES/200. Tests/Wedding.Layouts.Contracts.Tests/Wedding.Layouts.Contracts.Tests.csproj" --no-restore --configuration Release -m:1 --verbosity minimal --collect:"XPlat Code Coverage" --settings $settings --results-directory "$results\wedding-contracts" --logger "trx;LogFileName=wedding-contracts.trx"
          dotnet test "20_SOURCES/200. Tests/WeddingPlatform.LayoutWorkflow.Tests/WeddingPlatform.LayoutWorkflow.Tests.csproj" --no-restore --configuration Release -m:1 --verbosity minimal --collect:"XPlat Code Coverage" --settings $settings --results-directory "$results\wedding-workflow" --logger "trx;LogFileName=wedding-workflow.trx"

      - name: Run wedding layout pipeline smoke test
        run: dotnet run --project "20_SOURCES/200. Tests/Wedding.Layouts.PipelineSmoke/Wedding.Layouts.PipelineSmoke.csproj" --no-restore --configuration Release

      - name: Build representative samples
        run: |
          dotnet build "20_SOURCES/998. DEMO/000. Sample/010. Wpfs/SampleCore/SampleCore.csproj" --no-restore --configuration Release -m:1 --verbosity minimal
          dotnet build "20_SOURCES/998. DEMO/000. Sample/050. CrossUi/SampleCrossUi.Wpf/SampleCrossUi.Wpf.csproj" --no-restore --configuration Release -m:1 --verbosity minimal
          dotnet build "20_SOURCES/000. Project/010. App/Dreamine.Web/Dreamine.Web.csproj" --no-restore --configuration Release -m:1 --verbosity minimal
          dotnet build "20_SOURCES/000. Project/010. App/DreamineVMS.Web/DreamineVMS.Web.csproj" --no-restore --configuration Release -m:1 --verbosity minimal
          dotnet build "20_SOURCES/000. Project/010. App/DreamineVMS/DreamineVMS.csproj" --no-restore --configuration Release -m:1 --verbosity minimal
          dotnet build "20_SOURCES/000. Project/010. App/Families.AutoWriter/Families.AutoWriter.csproj" --no-restore --configuration Release -m:1 --verbosity minimal
          dotnet build "20_SOURCES/000. Project/010. App/Families.Web/Families.Web.csproj" --no-restore --configuration Release -m:1 --verbosity minimal
          dotnet build "20_SOURCES/000. Project/010. App/Portfolio.Web/Portfolio.Web.csproj" --no-restore --configuration Release -m:1 --verbosity minimal
          dotnet build "20_SOURCES/000. Project/010. App/ShopPlatform.Web/ShopPlatform.Web.csproj" --no-restore --configuration Release -m:1 --verbosity minimal
          dotnet build "20_SOURCES/000. Project/010. App/WeddingPlatform.Web/WeddingPlatform.Web.csproj" --no-restore --configuration Release -m:1 --verbosity minimal
          dotnet build "20_SOURCES/000. Project/010. App/WeddingThankYou/WeddingThankYou.csproj" --no-restore --configuration Release -m:1 --verbosity minimal
          dotnet build "20_SOURCES/000. Project/010. App/Wedding.Layouts.Editor.Wpf/Wedding.Layouts.Editor.Wpf.csproj" --no-restore --configuration Release -m:1 --verbosity minimal

      - name: End SonarCloud analysis
        if: >-
          success() &&
          env.SONAR_TOKEN != '' &&
          (github.ref == 'refs/heads/main' ||
           (github.event_name == 'pull_request' &&
            github.actor != 'dependabot[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository))
        shell: pwsh
        run: |
          $scanner = Join-Path $env:RUNNER_TEMP "sonar-scanner\dotnet-sonarscanner.exe"
          & $scanner end "/d:sonar.token=$env:SONAR_TOKEN"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  publish-nuget:
    name: Publish NuGet packages
    runs-on: windows-2025
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      id-token: write  # OIDC token for NuGet.org Trusted Publishing
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: false

      - name: Enable Git long paths
        run: git config --global core.longpaths true

      - name: Checkout submodules
        shell: pwsh
        run: |
          $modules = @()
          $current = @{}

          foreach ($line in Get-Content ".gitmodules") {
            if ($line -match '^\[submodule "(.+)"\]') {
              if ($current.Path -and $current.Url) {
                $modules += [pscustomobject]$current
              }
              $current = @{}
            }
            elseif ($line -match '^\s*path = (.+)$') {
              $current.Path = $Matches[1].Trim()
            }
            elseif ($line -match '^\s*url = (.+)$') {
              $current.Url = $Matches[1].Trim()
            }
          }

          if ($current.Path -and $current.Url) {
            $modules += [pscustomobject]$current
          }

          foreach ($module in $modules) {
            $treeLine = git ls-tree HEAD -- "$($module.Path)"
            if ($treeLine -notmatch '^160000\s+commit\s+([0-9a-f]+)\s+') {
              throw "Could not find gitlink SHA for $($module.Path)"
            }

            $sha = $Matches[1]
            Write-Host "Checking out $($module.Path) at $sha"
            New-Item -ItemType Directory -Force -Path (Split-Path $module.Path) | Out-Null
            git clone --no-checkout "$($module.Url)" "$($module.Path)"
            git -C "$($module.Path)" checkout "$sha"
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Login to NuGet.org (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: minsujang

      - name: Build and push all packages
        shell: cmd
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        working-directory: 20_SOURCES/100. Library
        run: call "NuGet.Org Push.bat"
